<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#65c3d0">
    <title>Código da Vida — Desafio Científico</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; font-family: Trebuchet MS, Arial, sans-serif; background: #e8f8f5; color: #12333b; }
        body { display: flex; justify-content: center; align-items: center; padding: 12px; }
        .app { width: min(100%, 430px); }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px 12px; }
        .logo { font-weight: 900; font-size: 15px; letter-spacing: 1px; color: #126477; }
        .logo span { vertical-align: middle; }
        .scorebox { background: #fff; border: 3px solid #234e50; border-radius: 10px; padding: 6px 11px; font-size: 10px; font-weight: 900; box-shadow: 0 3px 0 #234e50; }
        .scorebox b { font-size: 19px; margin-left: 7px; }
        .game-wrap { position: relative; width: 100%; border: 4px solid #234e50; border-radius: 8px; overflow: hidden; box-shadow: 0 7px 0 #234e50; background: #70c9d4; }
        canvas { display: block; width: 100%; height: auto; aspect-ratio: 390/690; touch-action: manipulation; }
        .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 22px; background: rgba(21, 63, 72, 0.3); }
        .overlay.hidden { display: none; }
        .card { width: 100%; text-align: center; background: #fff9df; border: 4px solid #234e50; border-radius: 15px; padding: 23px 17px; box-shadow: 0 7px 0 #234e50; }
        .badge { display: inline-block; background: #d7f16a; border: 2px solid #234e50; padding: 5px 9px; border-radius: 5px; font-size: 10px; font-weight: 900; letter-spacing: 1px; }
        h1 { font-size: 36px; line-height: .98; margin: 17px 0 12px; color: #183e48; text-shadow: 2px 2px #d7f16a; }
        h1 span { color: #36a84e; }
        p { font-size: 14px; line-height: 1.45; margin: 0 auto 20px; max-width: 260px; }
        button { border: 3px solid #234e50; border-radius: 8px; background: #8ee34d; color: #183e48; font-size: 16px; font-weight: 900; padding: 12px 24px; box-shadow: 0 4px 0 #234e50; cursor: pointer; }
        button:active { transform: translateY(3px); box-shadow: 0 1px 0 #234e50; }
        small { display: block; font-size: 10px; margin-top: 15px; color: #45666b; }
        footer { display: flex; justify-content: center; gap: 10px; padding: 15px; font-size: 11px; font-weight: 900; letter-spacing: 1px; color: #267786; text-transform: uppercase; }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <div class="logo">🧬 <span>CÓDIGO DA VIDA</span></div>
            <div class="scorebox">PONTOS <b id="score">0</b></div>
        </header>
        <section class="game-wrap">
            <canvas id="game" width="390" height="690" aria-label="Jogo de voo: toque para subir e desvie dos tubos"></canvas>
            <div class="overlay" id="overlay">
                <div class="card">
                    <div class="badge">MISSÃO CIENTÍFICA</div>
                    <h1 id="overlay-title">Voe pela<br><span>ciência!</span></h1>
                    <p id="overlay-text">Controle seu pesquisador, passe pelos obstáculos e colete moléculas de conhecimento.</p>
                    <button id="start">COMEÇAR</button>
                    <small>Toque na tela ou aperte espaço para voar</small>
                </div>
            </div>
        </section>
        <footer>
            <span>Explore</span><span>•</span><span>Aprenda</span><span>•</span><span>Descubra</span>
        </footer>
    </main>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayText = document.getElementById('overlay-text');

        let score = 0;
        let gameState = 'START'; // START, PLAYING, GAMEOVER

        const player = {
            x: 80,
            y: 250,
            radius: 16,
            gravity: 0.5,
            lift: -8,
            velocity: 0
        };

        let pipes = [];
        let frameCount = 0;

        function resetGame() {
            player.y = 250;
            player.velocity = 0;
            pipes = [];
            score = 0;
            frameCount = 0;
            scoreEl.textContent = score;
        }

        function jump() {
            if (gameState === 'PLAYING') {
                player.velocity = player.lift;
            } else if (gameState === 'START' || gameState === 'GAMEOVER') {
                resetGame();
                gameState = 'PLAYING';
                overlay.classList.add('hidden');
            }
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });

        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        }, { passive: false });

        startBtn.addEventListener('click', () => {
            resetGame();
            gameState = 'PLAYING';
            overlay.classList.add('hidden');
        });

        function spawnPipe() {
            const gap = 170;
            const minHeight = 60;
            const maxHeight = canvas.height - gap - 60;
            const height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: height,
                bottom: canvas.height - height - gap,
                passed: false
            });
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            player.velocity += player.gravity;
            player.y += player.velocity;

            // Limites do canvas (chão e teto)
            if (player.y + player.radius >= canvas.height || player.y - player.radius <= 0) {
                gameOver();
            }

            // Gerar tubos
            if (frameCount % 100 === 0) {
                spawnPipe();
            }

            // Mover e verificar colisão com tubos
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 3;

                // Colisão
                if (
                    player.x + player.radius > pipes[i].x &&
                    player.x - player.radius < pipes[i].x + 60 &&
                    (player.y - player.radius < pipes[i].top || player.y + player.radius > canvas.height - pipes[i].bottom)
                ) {
                    gameOver();
                }

                // Pontuação
                if (!pipes[i].passed && pipes[i].x + 60 < player.x) {
                    score++;
                    scoreEl.textContent = score;
                    pipes[i].passed = true;
                }

                // Remover tubos fora da tela
                if (pipes[i].x + 60 < 0) {
                    pipes.splice(i, 1);
                }
            }

            frameCount++;
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            overlayTitle.innerHTML = 'Fim de<br><span>Jogo!</span>';
            overlayText.innerHTML = `Fizeste <b>${score}</b> pontos. Tenta novamente para avançar na ciência!`;
            startBtn.textContent = 'JOGAR NOVAMENTE';
            overlay.classList.remove('hidden');
        }

        function draw() {
            // Fundo
            ctx.fillStyle = '#70c9d4';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar Tubos
            ctx.fillStyle = '#2d8a56';
            ctx.strokeStyle = '#234e50';
            ctx.lineWidth = 3;

            pipes.forEach(pipe => {
                // Tubo Superior
                ctx.fillRect(pipe.x, 0, 60, pipe.top);
                ctx.strokeRect(pipe.x, 0, 60, pipe.top);

                // Tubo Inferior
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, 60, pipe.bottom);
                ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, 60, pipe.bottom);
            });

            // Desenhar Jogador (Pesquisador / Molécula)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff9df';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#234e50';
            ctx.stroke();
            ctx.closePath();

            // Ícone interno (🧬)
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🧬', player.x, player.y);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
